name: 24/7 Autonomous AI Deal Agent Team

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions / CLI

permissions:
  contents: write

jobs:
  autopilot-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute 5-Agent SastaAI Autonomous Pipeline
        env:
          VITE_ATRIA_API_KEY: ${{ secrets.VITE_ATRIA_API_KEY || 'atr_5hupTz5ZY9UwtjvGVk6qH_W5fYjRULX8' }}
          VITE_ATRIA_API_BASE: ${{ secrets.VITE_ATRIA_API_BASE || 'https://api.atria-asi.ai/v1' }}
          VITE_ATRIA_MODEL: ${{ secrets.VITE_ATRIA_MODEL || 'Atria-Dawn-Preview' }}
        run: |
          node scripts/autopilot-agent-team.js

      - name: Commit and Push Newly Scouted Deals
        run: |
          git config --global user.name "SastaAI Autopilot Bot"
          git config --global user.email "autopilot@sastabazar.com"
          git add src/seed-data.json admin/src/seed-data.json broadcast-queue.json || true
          if git diff --staged --quiet; then
            echo "Catalog already up to date. No new commits needed."
          else
            git commit -m "chore(autopilot): auto-scout and publish verified deals to catalog"
            git push origin main
          fi
