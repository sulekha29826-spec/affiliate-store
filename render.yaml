services:
  - type: web
    name: affiliate-store-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: affiliate-store-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://affiliate-store.vercel.app
      - key: CORS_ORIGIN
        value: https://affiliate-store.vercel.app

databases:
  - name: affiliate-store-db
    databaseName: affiliate_store
    user: affiliate_user
    plan: free
